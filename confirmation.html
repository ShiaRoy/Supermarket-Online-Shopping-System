<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Order confirmation')}"></head><body><header th:replace="~{fragments :: header('confirmation')}"></header><main class="shop-container"><section class="panel"><p class="text-success">✓ Order received</p><h1 th:text="'Thank you! Order #' + ${order.id}"></h1><p>Your order is saved. Payment is pending; it has not been charged.</p>
<p><strong>Deliver to: </strong><span th:text="${order.address}"></span></p><p><strong>Time: </strong><span th:text="${order.deliverySlot}"></span></p><p><strong>Payment: </strong><span th:text="${order.paymentMethod}"></span> · <span th:text="${order.paymentStatus}"></span></p>
<div class="table-responsive"><table class="table"><thead><tr><th>Item</th><th>Quantity</th><th>Unit price</th><th>Line total</th></tr></thead><tbody><tr th:each="item : ${order.items}"><td th:text="${item.name}"></td><td th:text="${item.quantity}"></td><td th:text="'$' + ${#numbers.formatDecimal(item.unitPrice,1,2)}"></td><td th:text="'$' + ${#numbers.formatDecimal(item.lineTotal,1,2)}"></td></tr></tbody></table></div>
<p th:text="'Subtotal: $' + ${#numbers.formatDecimal(order.subtotal,1,2)}"></p><p th:text="'Delivery: $' + ${#numbers.formatDecimal(order.delivery,1,2)}"></p><p th:text="'Discount: −$' + ${#numbers.formatDecimal(order.discount,1,2)}"></p><h2 th:text="'Total: $' + ${#numbers.formatDecimal(order.total,1,2)}"></h2><a th:href="@{/orders}" class="btn btn-success">My orders</a></section></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
