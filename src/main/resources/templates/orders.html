<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="description"
          content="View your Bula Basket orders." />

    <title>Bula Basket | My Orders</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com" />

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin />

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap"
          rel="stylesheet" />

    <link rel="stylesheet"
          th:href="@{/css/styles.css}" />
    <link rel="stylesheet" th:href="@{/css/orders-payments.css}" />

    <style>
        .orders-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 28px;
            flex-wrap: wrap;
        }

        .orders-logo {
            width: 220px;
            max-height: 72px;
            object-fit: contain;
            object-position: left center;
            display: block;
        }

        .orders-nav {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .orders-nav a {
            color: white;
            text-decoration: none;
            font-weight: 600;
        }

        .orders-nav a:hover {
            opacity: 0.8;
        }

        .logout-form {
            margin: 0;
        }

        .logout-link {
            border: 0;
            background: transparent;
            color: white;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            padding: 0;
        }

        .orders-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 26px;
        }

        .order-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .empty-orders {
            background: white;
            padding: 36px;
            border-radius: 18px;
            text-align: center;
        }
    </style>
    <link rel="stylesheet" th:href="@{/css/navigation.css}" />
</head>

<body>

<header th:replace="~{fragments :: siteHeader('orders')}"></header>


<main>

    <section class="shell orders-page">

        <div class="orders-top">

            <div>
                <h1 class="section-title">
                    My Orders
                </h1>

                <p class="meta">
                    View your previous orders and track deliveries.
                </p>
            </div>

            <a class="btn"
               th:href="@{/products}">
                Continue shopping
            </a>
            <a class="btn btn-outline" th:href="@{/payment-history}">Payment history</a>

        </div>

        <div class="alert alert-success" th:if="${message}" role="status" th:text="${message}"></div>
        <div class="alert alert-danger" th:if="${error}" role="alert" th:text="${error}"></div>


        <div class="empty-orders"
             th:if="${#lists.isEmpty(orders)}">

            <h2>No orders yet</h2>

            <p class="meta">
                Your completed orders will appear here.
            </p>

            <a class="btn"
               th:href="@{/products}">
                Shop groceries
            </a>

        </div>


        <article class="order-card"
                 th:each="order : ${orders}">

            <div>

                <div class="order-id"
                     th:text="|Order #${order.id}|">
                </div>

                <span class="meta">

                    <span th:text="${order.orderDate != null
                        ? #temporals.format(order.orderDate, 'dd MMM yyyy, h:mm a')
                        : 'Date unavailable'}">
                    </span>

                    &middot;

                    <span th:text="${order.totalAmount != null
                        ? 'FJ$ ' + #numbers.formatDecimal(order.totalAmount, 1, 'COMMA', 2, 'POINT')
                        : 'Total unavailable'}">
                    </span>

                </span>

            </div>


            <div class="order-actions">

                <span class="status"
                      th:classappend="${order.status.name() == 'CANCELLED'} ? ' delivered' : ''"
                      th:text="${order.status}">
                </span>


                <a class="btn" th:if="${order.status.name() != 'CANCELLED'}"
                   th:href="@{/delivery/track/{orderId}(orderId=${order.id})}">
                    Track order
                </a>


                <a class="btn btn-outline"
                   th:href="@{/orders/{orderId}/confirmation(orderId=${order.id})}">
                    Details
                </a>

                <form th:if="${cancellableOrderIds.contains(order.id)}"
                      th:action="@{/orders/{orderId}/cancel(orderId=${order.id})}" method="post">
                    <button class="btn btn-outline" type="submit">Cancel order</button>
                </form>

            </div>

        </article>

    </section>

</main>


<footer>
    Bula Basket · Fresh groceries around Suva · © 2026
</footer>

</body>

</html>
