<!doctype html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title th:text="${title} + ' | Bula Basket'">Bula Basket</title>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap">

  <link rel="stylesheet" th:href="@{/css/products/styles.css}">
  <link rel="stylesheet" th:href="@{/css/products/module.css}">
  <link rel="stylesheet" th:href="@{/css/navigation.css}">

  <script defer th:src="@{/js/products.js}"></script>
</head>

<body>

<footer th:fragment="footer">
  Bula Basket &middot; Suva, Fiji &middot; 2026
</footer>


<!--
  Product icon:
  1. Use a specific icon when the product already has a recognised icon key.
  2. If the icon key is unknown, choose a sensible icon from the category.
  3. Only use the basket as the final fallback.
-->
<span th:fragment="icon(key, category)"
      aria-hidden="true">

  <span th:switch="${key}">

    <span th:case="'milk'">🥛</span>
    <span th:case="'bread'">🍞</span>
    <span th:case="'rice'">🍚</span>
    <span th:case="'banana'">🍌</span>
    <span th:case="'apple'">🍎</span>
    <span th:case="'potato'">🥔</span>
    <span th:case="'eggs'">🥚</span>
    <span th:case="'cheese'">🧀</span>
    <span th:case="'sugar'">🧂</span>
    <span th:case="'flour'">🌾</span>
    <span th:case="'oil'">🧴</span>
    <span th:case="'juice'">🧃</span>
    <span th:case="'drink'">🥤</span>
    <span th:case="'water'">💧</span>
    <span th:case="'chips'">🍿</span>
    <span th:case="'cleaning'">🧼</span>
    <span th:case="'tissue'">🧻</span>
    <span th:case="'frozen'">❄️</span>
    <span th:case="'chicken'">🍗</span>

    <span th:case="*">

      <span th:switch="${category}">
        <span th:case="'Dairy'">🥛</span>
        <span th:case="'Produce'">🍎</span>
        <span th:case="'Bakery'">🍞</span>
        <span th:case="'Beverages'">🧃</span>
        <span th:case="'Pantry'">🥫</span>
        <span th:case="'Snacks'">🍿</span>
        <span th:case="'Household'">🧼</span>
        <span th:case="'Frozen'">❄️</span>
        <span th:case="*">🧺</span>
      </span>

    </span>

  </span>

</span>


<div th:fragment="cards"
     class="products search-products">

  <article class="product-card"
           th:each="item : ${items}">

    <div class="product-visual">

      <span class="stock"
            th:classappend="${item.quantity <= 10} ? 'low'"
            th:text="${item.status}">
        In stock
      </span>

      <span th:replace="~{products/fragments :: icon(${item.product.icon}, ${item.product.category})}">
      </span>

    </div>


    <div class="product-body">

      <h3>
        <a th:href="@{/products/{id}(id=${item.product.id},storeId=${store.id})}"
           th:text="${item.product.name}">
          Product
        </a>
      </h3>

      <span class="category"
            th:text="${item.product.category}">
        Category
      </span>

      <span class="price"
            th:text="|FJ$ ${#numbers.formatDecimal(item.product.price,1,2)}|">
        Price
      </span>


      <form sec:authorize="hasRole('CUSTOMER')"
            th:if="${item.quantity > 0}"
            th:action="@{/cart/quantity}"
            method="post">

        <input type="hidden"
               name="productId"
               th:value="${item.product.id}">

        <input type="hidden"
               name="delta"
               value="1">

        <input type="hidden"
               name="returnTo"
               th:value="|/products?storeId=${store.id}|">

        <button class="btn add-btn"
                type="submit">
          Add to cart
        </button>

      </form>


      <a class="text-link"
         th:href="@{/products/{id}(id=${item.product.id},storeId=${store.id})}">
        View product
      </a>

    </div>
  </article>


  <p class="empty-state"
     th:if="${#lists.isEmpty(items)}">
    No products found.
  </p>

</div>


<div th:fragment="filters"
     class="filters filter-toolbar">

  <div class="form-group filter-group">

    <label for="storeId">Store</label>

    <select id="storeId"
            name="storeId">

      <option th:each="branch : ${stores}"
              th:value="${branch.id}"
              th:text="${branch.name}"
              th:selected="${store != null and branch.id == store.id}">
      </option>

    </select>

  </div>


  <div class="form-group filter-group">

    <label for="category">Aisle</label>

    <select id="category"
            name="category">

      <option value="">
        All aisles
      </option>

      <option th:each="aisle : ${categories}"
              th:value="${aisle}"
              th:text="${aisle}"
              th:selected="${aisle == category}">
      </option>

    </select>

  </div>


  <div class="filter-group">

    <label for="min">
      Price range (FJ$)
    </label>

    <div class="range">

      <input id="min"
             name="min"
             type="number"
             min="0"
             step="0.01"
             placeholder="Min"
             th:value="${min}"
             aria-label="Minimum price">

      <input name="max"
             type="number"
             min="0"
             step="0.01"
             placeholder="Max"
             th:value="${max}"
             aria-label="Maximum price">

    </div>

  </div>


  <div class="form-group filter-group">

    <label for="availability">
      Availability
    </label>

    <select id="availability"
            name="availability">

      <option value="">
        All stock levels
      </option>

      <option value="in"
              th:selected="${availability == 'in'}">
        In stock
      </option>

      <option value="low"
              th:selected="${availability == 'low'}">
        Low stock
      </option>

      <option value="out"
              th:selected="${availability == 'out'}">
        Out of stock
      </option>

    </select>

  </div>


  <button class="btn place-order"
          type="submit">
    Apply filters
  </button>


  <a class="text-link reset-link"
     th:href="@{/products(storeId=${store?.id})}">
    Clear filters
  </a>

</div>

</body>
</html>
