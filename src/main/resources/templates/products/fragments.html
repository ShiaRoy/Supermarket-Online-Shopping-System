<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title th:text="${title} + ' | Bula Basket'">Bula Basket</title>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap">

  <link rel="stylesheet" th:href="@{/css/products/styles.css}">
  <link rel="stylesheet" th:href="@{/css/products/module.css}">

  <script defer th:src="@{/js/products.js}"></script>
</head>

<body>

<header th:fragment="header" class="site-header">
  <div class="header-inner">

    <a class="brand" th:href="@{/products}">
      <span class="brand-mark">B</span>

      <span>
        <strong>Bula Basket</strong>
        <small>Fresh groceries around Suva</small>
      </span>
    </a>

    <button class="menu-toggle"
            type="button"
            aria-label="Toggle navigation"
            aria-expanded="false"
            aria-controls="primary-nav">
      &#9776;
    </button>

    <nav id="primary-nav"
         class="nav"
         aria-label="Primary navigation">

      <a th:href="@{/products}">Home</a>
      <a th:href="@{/search}">Search</a>
      <a th:href="@{/cart}">Cart</a>
      <a th:href="@{/inventory}">Inventory</a>

    </nav>
  </div>
</header>


<footer th:fragment="footer">
  Bula Basket &middot; Suva, Fiji &middot; 2026
</footer>


<span th:fragment="icon(key)"
      th:switch="${key}"
      aria-hidden="true">

  <span th:case="'milk'">&#129371;</span>
  <span th:case="'bread'">&#127838;</span>
  <span th:case="'chicken'">&#127831;</span>
  <span th:case="'juice'">&#129475;</span>
  <span th:case="'drink'">&#129380;</span>
  <span th:case="*">&#129530;</span>

</span>


<div th:fragment="cards"
     class="products search-products">

  <article class="product-card"
           th:each="item : ${items}">

    <div class="product-visual">

      <span class="stock"
            th:classappend="${item.quantity <= 10} ? 'low'"
            th:text="${item.status}">
        In stock
      </span>

      <span th:replace="~{products/fragments :: icon(${item.product.icon})}"></span>

    </div>


    <div class="product-body">

      <h3>
        <a th:href="@{/products/{id}(id=${item.product.id},storeId=${store.id})}"
           th:text="${item.product.name}">
          Product
        </a>
      </h3>

      <span class="category"
            th:text="${item.product.category}">
        Category
      </span>

      <span class="price"
            th:text="|FJ$ ${#numbers.formatDecimal(item.product.price,1,2)}|">
        Price
      </span>


      <form th:if="${item.quantity > 0}"
            th:action="@{/cart/quantity}"
            method="post">

        <input type="hidden"
               name="productId"
               th:value="${item.product.id}">

        <input type="hidden"
               name="delta"
               value="1">

        <button class="btn add-btn"
                type="submit">
          Add to cart
        </button>

      </form>


      <a class="text-link"
         th:href="@{/products/{id}(id=${item.product.id},storeId=${store.id})}">
        View product
      </a>

    </div>
  </article>


  <p class="empty-state"
     th:if="${#lists.isEmpty(items)}">
    No products found.
  </p>

</div>


<form th:fragment="filters(action)"
      class="filters"
      method="get"
      th:action="@{${action}}">

  <div class="form-group filter-group">

    <label for="q">Search products</label>

    <input id="q"
           name="q"
           type="search"
           maxlength="120"
           th:value="${q}"
           placeholder="Product name">

  </div>


  <div class="form-group filter-group">

    <label for="storeId">Store</label>

    <select id="storeId" name="storeId">

      <option th:each="branch : ${stores}"
              th:value="${branch.id}"
              th:text="${branch.name}"
              th:selected="${store != null and branch.id == store.id}">
      </option>

    </select>

  </div>


  <div class="form-group filter-group">

    <label for="category">Aisle</label>

    <select id="category" name="category">

      <option value="">
        All aisles
      </option>

      <option th:each="aisle : ${categories}"
              th:value="${aisle}"
              th:text="${aisle}"
              th:selected="${aisle == category}">
      </option>

    </select>

  </div>


  <div class="filter-group">

    <label for="min">
      Price range (FJ$)
    </label>

    <div class="range">

      <input id="min"
             name="min"
             type="number"
             min="0"
             step="0.01"
             placeholder="Min"
             th:value="${min}"
             aria-label="Minimum price">

      <input name="max"
             type="number"
             min="0"
             step="0.01"
             placeholder="Max"
             th:value="${max}"
             aria-label="Maximum price">

    </div>

  </div>


  <div class="form-group filter-group">

    <label for="availability">
      Availability
    </label>

    <select id="availability"
            name="availability">

      <option value="">
        All stock levels
      </option>

      <option value="in"
              th:selected="${availability == 'in'}">
        In stock
      </option>

      <option value="low"
              th:selected="${availability == 'low'}">
        Low stock
      </option>

      <option value="out"
              th:selected="${availability == 'out'}">
        Out of stock
      </option>

    </select>

  </div>


  <button class="btn place-order"
          type="submit">
    Apply filters
  </button>


  <a class="text-link reset-link"
     th:href="@{${action}(storeId=${store?.id})}">
    Clear filters
  </a>

</form>

</body>
</html>
