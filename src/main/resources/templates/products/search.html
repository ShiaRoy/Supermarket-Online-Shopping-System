<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{products/fragments :: head('Search')}"></head>
<body data-page="search">
<header th:replace="~{fragments :: siteHeader('products')}"></header>
<main class="shell">
  <div class="search-head"><h1 class="section-title" th:text="${#strings.isEmpty(q)} ? 'Products' : 'Products matching ' + ${q}">Products</h1><span class="meta" th:text="|${#lists.size(items)} items|"></span></div>
  <p class="catalogue-message" th:if="${message}" role="status" th:text="${message}"></p>
  <div class="search-layout"><form class="catalogue-controls" method="get" th:action="@{/products}"><div class="catalogue-toolbar"><label class="visually-hidden" for="catalogue-query">Search products</label><input id="catalogue-query" name="q" type="search" maxlength="120" th:value="${q}" placeholder="Search groceries..."><details class="catalogue-filters"><summary>Filters</summary><div th:replace="~{products/fragments :: filters}"></div></details><button class="visually-hidden" type="submit">Search</button></div></form><div th:replace="~{products/fragments :: cards}"></div></div>
</main>
<footer th:replace="~{products/fragments :: footer}"></footer>
</body></html>
