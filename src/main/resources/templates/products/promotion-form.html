<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{products/fragments :: head('Manage promotion')}"></head>
<body>
<header th:replace="~{fragments :: siteHeader('inventory')}"></header>
<main class="shell form-shell">
  <h1 class="section-title" th:text="${promotionId == null} ? 'Add promotion' : 'Edit promotion'"></h1>
  <p th:if="${#lists.isEmpty(products)}">Add a product before creating a promotion.</p>
  <form th:unless="${#lists.isEmpty(products)}" method="post" th:object="${promotionForm}"
    th:action="${promotionId == null} ? @{/inventory/promotions} : @{/inventory/promotions/{id}(id=${promotionId})}">
    <div class="alert alert-danger" role="alert" th:if="${#fields.hasAnyErrors()}"><ul><li th:each="err : ${#fields.allErrors()}" th:text="${err}"></li></ul></div>
    <input type="hidden" th:field="*{version}">
    <div class="form-grid two-col">
      <div class="form-group"><label for="name">Promotion name</label><input id="name" th:field="*{name}" maxlength="100" required></div>
      <div class="form-group"><label for="productId">Product</label><select id="productId" th:field="*{productId}" required>
        <option th:each="product : ${products}" th:if="${promotionId == null or product.id == promotionForm.productId}" th:value="${product.id}" th:text="${product.name}"></option>
      </select></div>
      <div class="form-group"><label for="percentOff">Discount (%)</label><input id="percentOff" th:field="*{percentOff}" type="number" min="0.01" max="99" step="0.01" required></div>
      <label class="check-line"><input type="checkbox" th:field="*{enabled}">Enabled</label>
      <div class="form-group"><label for="startsOn">Start date (Fiji)</label><input id="startsOn" th:field="*{startsOn}" type="date" required></div>
      <div class="form-group"><label for="endsOn">End date (Fiji)</label><input id="endsOn" th:field="*{endsOn}" type="date" required></div>
    </div>
    <div class="form-actions"><button class="btn" type="submit">Save promotion</button><a class="btn btn-outline" th:href="@{/inventory/promotions}">Cancel</a></div>
  </form>
</main>
<footer th:replace="~{products/fragments :: footer}"></footer>
</body></html>
