<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bula Basket | Track order</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <link rel="stylesheet" th:href="@{/css/styles.css}" />
  <link rel="stylesheet" th:href="@{/css/navigation.css}" />
</head>
<body>
  <header th:replace="~{fragments :: siteHeader('orders')}"></header>
  <main><section class="shell">
    <h1 class="section-title">Track your grocery delivery</h1>
    <p class="meta">Enter your order number to see where your groceries are.</p>
    <div class="delivery-note" th:if="${error}" th:text="${error}" style="margin:16px 0;background:#fde3df;color:#a73525">No delivery found</div>
    <form th:action="@{/delivery/track}" method="get" style="display:flex;flex-wrap:wrap;gap:10px;margin-top:16px">
      <input type="number" name="orderId" min="1" required placeholder="Order number, e.g. 1"
             style="padding:12px 14px;border:1px solid #d9d2c3;border-radius:12px;font:inherit;min-width:240px" />
      <button type="submit" class="btn">Track order</button>
    </form>
  </section></main>
  <footer>Bula Basket · Privacy policy · Contact us · © 2026, Suva, Fiji</footer>
</body>
</html>
