<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Bula Basket order confirmation." />
    <title>Bula Basket | Confirmation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" th:href="@{/css/styles.css}" />
    <link rel="stylesheet" th:href="@{/css/navigation.css}" />
  </head>
  <body data-page="confirmation">
    <header th:replace="~{fragments :: siteHeader('orders')}"></header>
    <main>
      <section class="shell confirmation">
        <div class="success">✓</div>
        <h1>Order placed — vinaka!</h1>
        <p class="confirmation-sub">
          <span th:text="|Order #${order.id}|"></span> &middot;
          <span th:text="${order.orderDate != null ? #temporals.format(order.orderDate, 'dd MMM yyyy, h:mm a') : 'Date not available'}"></span>
        </p>
        <div class="progress">
          <div class="progress-step active">
            <div class="dot"></div>
            Confirmed
          </div>
          <div class="progress-step">
            <div class="dot"></div>
            Packing
          </div>
          <div class="progress-step">
            <div class="dot"></div>
            Out for delivery
          </div>
          <div class="progress-step">
            <div class="dot"></div>
            Delivered
          </div>
        </div>
        <div class="panel" style="text-align: left">
          <h2>Order details</h2>
          <div class="detail-line">
            <span>Order ID</span><span th:text="|#${order.id}|"></span>
          </div>
          <div class="detail-line">
            <span>Order status</span><span th:text="${order.status}"></span>
          </div>
          <div class="detail-line">
            <span>Payment status</span>
            <span th:text="${payment != null and payment.status != null ? payment.status : 'No payment recorded'}"></span>
          </div>
        </div>
        <div class="panel order-items" style="margin-top: 16px">
          <h2>Payment details</h2>
          <div class="detail-line">
            <span>Transaction reference</span>
            <span th:text="${payment != null and !#strings.isEmpty(payment.transactionReference) ? payment.transactionReference : 'Not available'}"></span>
          </div>
          <div class="detail-line">
            <span>Payment date</span>
            <span th:text="${payment != null and payment.paymentDate != null ? #temporals.format(payment.paymentDate, 'dd MMM yyyy, h:mm a') : 'Not available'}"></span>
          </div>
          <div class="detail-line" th:if="${payment != null and !#strings.isEmpty(payment.failureReason)}">
            <span>Failure reason</span><span th:text="${payment.failureReason}"></span>
          </div>
          <div class="detail-line paid">
            <span>Total amount</span>
            <strong th:text="${order.totalAmount != null ? '$' + #numbers.formatDecimal(order.totalAmount, 1, 'COMMA', 2, 'POINT') : 'Not available'}"></strong>
          </div>
        </div>
        <div class="actions">
          <a class="btn btn-outline" th:href="@{/}">Back to home</a
          ><a class="btn" th:href="@{/orders}">View my orders</a>
        </div>
      </section>
    </main>
    <footer>
      Bula Basket · Privacy policy · Contact us · © 2026, Suva, Fiji
    </footer>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
