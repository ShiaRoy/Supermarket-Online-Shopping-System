<!doctype html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <title>Bula Basket | Profile</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap"
        rel="stylesheet" />

  <link rel="stylesheet" th:href="@{/css/auth.css}" />
  <link rel="stylesheet" th:href="@{/css/navigation.css}" />
</head>

<body>

<header th:replace="~{fragments :: siteHeader('profile')}"></header>


<main>

  <section class="shell">

    <div class="profile-card">

      <div class="profile-head">

        <div class="avatar"
             th:text="${#strings.substring(account.fullName,0,1)}">
        </div>

        <div>
          <h1>My profile</h1>
          <p>Manage your account and delivery details.</p>
        </div>

      </div>


      <p role="status"
         th:if="${param.saved}">
        Profile saved.
      </p>


      <p class="profile-role">
        Role:
        <strong th:text="${account.role.name() == 'ADMIN' ? 'Administrator' : #strings.capitalize(#strings.toLowerCase(account.role.name()))}">Customer</strong>
      </p>


      <form class="form-grid two-col"
            method="post"
            th:action="@{/profile}"
            th:object="${profile}">

        <div class="validation"
             role="alert"
             th:if="${#fields.hasErrors('*')}">

          <p th:each="e : ${#fields.errors('*')}"
             th:text="${e}">
          </p>

        </div>


        <div class="form-group">

          <label for="fullName">
            Full name
          </label>

          <input id="fullName"
                 th:field="*{fullName}"
                 required
                 maxlength="100" />

        </div>


        <div class="form-group">

          <label for="email">
            Email address
          </label>

          <input id="email"
                 type="email"
                 th:value="${account.email}"
                 readonly />

        </div>


        <div class="form-group">

          <label for="phone">
            Phone number (+679)
          </label>

          <input id="phone"
                 th:field="*{phone}"
                 required
                 pattern="[0-9]{7}"
                 maxlength="7" />

        </div>


        <div class="form-group full">

          <label for="deliveryAddress">
            Delivery address
          </label>

          <textarea id="deliveryAddress"
                    th:field="*{deliveryAddress}"
                    rows="3"
                    maxlength="500"></textarea>

        </div>


        <button class="btn full"
                type="submit">
          Save changes
        </button>

      </form>

      <form method="post"
            th:action="@{/logout}">

        <button class="btn btn-outline"
                type="submit">
          Log out
        </button>

      </form>

    </div>

  </section>

</main>


<footer>
  Bula Basket · Privacy policy · Contact us · © 2026, Suva, Fiji
</footer>

</body>
</html>
