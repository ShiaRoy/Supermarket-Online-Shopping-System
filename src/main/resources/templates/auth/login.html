<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Bula Basket | Login</title>

    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>

<body>

<header class="site-header">
    <div class="header-inner">

        <a class="brand" th:href="@{/}">
            <span class="brand-mark">B</span>

            <span>
                <strong>Bula Basket</strong>
                <small>Fresh groceries around Suva</small>
            </span>
        </a>

        <nav class="nav">
            <a th:href="@{/}">Home</a>
            <a th:href="@{/login}">Login</a>
            <a th:href="@{/register}">Register</a>
        </nav>

    </div>
</header>


<main class="auth-shell">

    <section class="auth-card">

        <h1>Welcome back</h1>

        <p class="auth-subtitle">
            Log in to your Bula Basket account.
        </p>

        <p class="validation"
           th:if="${param.error}">
            Invalid email or password.
        </p>

        <p th:if="${param.logout}">
            You have logged out.
        </p>

        <p th:if="${param.registered}">
            Account created. Please log in.
        </p>


        <form class="form-grid"
              method="post"
              th:action="@{/login}">

            <div class="form-group">
                <label for="email">Email address</label>

                <input id="email"
                       name="email"
                       type="email"
                       required
                       autocomplete="username"
                       placeholder="Enter your email">
            </div>


            <div class="form-group">
                <label for="password">Password</label>

                <input id="password"
                       name="password"
                       type="password"
                       required
                       autocomplete="current-password">
            </div>


            <button class="btn auth-submit"
                    type="submit">
                Log in
            </button>

        </form>


        <hr class="auth-divider">


        <div class="auth-switch">
            New to Bula Basket?

            <a class="text-link"
               th:href="@{/register}">
                Create an account
            </a>
        </div>

    </section>

</main>


<footer>
    Bula Basket · © 2026
</footer>

</body>
</html>
