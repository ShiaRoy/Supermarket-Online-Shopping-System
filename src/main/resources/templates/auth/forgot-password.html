<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>Bula Basket | Forgot password</title>
<link rel="stylesheet" th:href="@{/css/auth.css}"><link rel="stylesheet" th:href="@{/css/navigation.css}">
<link rel="stylesheet" th:href="@{/css/accounts-phase2.css}"></head>
<body><header th:replace="~{fragments :: siteHeader('profile')}"></header>
<main class="shell"><section class="profile-card"><h1>Forgot password</h1><p>Enter your account email to request a password reset link.</p>
<p class="account-notice" role="status" th:if="${param.sent}">If an account matches this email, a reset link will be sent. Check your inbox and spam folder. Please wait a minute before requesting another link.</p>
<form class="form-grid" method="post" th:action="@{/forgot-password}" th:object="${forgotForm}"><div class="validation full" role="alert" th:if="${#fields.hasErrors('*')}"><p th:each="e : ${#fields.errors('*')}" th:text="${e}"></p></div>
<div class="form-group"><label for="email">Email address</label><input id="email" type="email" th:field="*{email}" required maxlength="254" autocomplete="email"></div>
<button class="btn" type="submit">Request reset link</button></form><p><a class="text-link" th:href="@{/login}">Back to login</a></p></section></main>
<footer>Bula Basket · Fresh groceries around Suva · Fiji</footer></body></html>
