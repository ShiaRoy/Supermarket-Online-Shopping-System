<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>Bula Basket | Change password</title>
<link rel="stylesheet" th:href="@{/css/auth.css}"><link rel="stylesheet" th:href="@{/css/navigation.css}">
<link rel="stylesheet" th:href="@{/css/accounts-phase2.css}"></head>
<body><header th:replace="~{fragments :: siteHeader('profile')}"></header>
<main class="shell"><section class="profile-card"><h1>Change password</h1><p>Enter your current password to choose a new one. You will be asked to log in again.</p>
<form class="form-grid" method="post" th:action="@{/profile/password}" th:object="${passwordForm}"><div class="validation full" role="alert" th:if="${#fields.hasErrors('*')}"><p th:each="e : ${#fields.errors('*')}" th:text="${e}"></p></div>
<div class="form-group"><label for="currentPassword">Current password</label><input id="currentPassword" name="currentPassword" type="password" required autocomplete="current-password"></div>
<div class="form-group"><label for="password">New password</label><input id="password" name="password" type="password" required minlength="8" maxlength="72" autocomplete="new-password"><small>Use at least 8 characters (maximum 72 UTF-8 bytes).</small></div>
<div class="form-group"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" name="confirmPassword" type="password" required minlength="8" maxlength="72" autocomplete="new-password"></div><button class="btn" type="submit">Change password</button></form><p><a class="text-link" th:href="@{/profile}">Back to profile</a></p></section></main>
<footer>Bula Basket · Fresh groceries around Suva · Fiji</footer></body></html>
