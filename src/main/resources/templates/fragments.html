<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:fragment="head(title)">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="${title} + ' · Bula Basket'">Bula Basket</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link th:href="@{/css/cart-checkout.css}" rel="stylesheet"></head><body>
<header th:fragment="header(active)" class="site-header"><div class="brand"><span class="brand-mark">B</span><div><strong>Bula Basket</strong><small>Fresh groceries around Suva</small></div></div>
<nav aria-label="Main navigation"><a th:href="@{/}" th:classappend="${active=='home' ? 'active' : ''}">Home</a><a th:href="@{/search}">Search</a><a th:href="@{/cart}" th:classappend="${active=='cart' ? 'active' : ''}">Cart</a><a th:href="@{/confirmation}" th:classappend="${active=='confirmation' ? 'active' : ''}">Confirmation</a><a th:href="@{/orders}" th:classappend="${active=='orders' ? 'active' : ''}">My orders</a></nav>
<a class="cart-badge" th:href="@{/cart}">🛍️ Cart <span th:text="${basket.count}">3</span></a></header>
<footer th:fragment="footer">Bula Basket · Fresh groceries around Suva · Fiji
<form th:action="@{/logout}" method="post" class="d-inline ms-3"><button class="link-button">Sign out</button></form></footer>
</body></html>
