<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' · Bula Basket'">Bula Basket</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/cart-checkout.css}">
  <link rel="stylesheet" th:href="@{/css/navigation.css}">
  <link rel="stylesheet" th:href="@{/css/orders-payments.css}">
</head>
<body>
<header th:fragment="siteHeader(active)" class="soss-header">
  <div class="soss-header-inner">
    <a class="soss-brand" th:href="@{/}" aria-label="Bula Basket home">
      <img th:src="@{/images/bula-basket-logo.png}" alt="Bula Basket">
    </a>
    <form class="soss-search" th:if="${active == 'home'}" method="get" th:action="@{/products}" role="search">
      <label class="visually-hidden" for="site-search">Search groceries</label>
      <input id="site-search" name="q" type="search" maxlength="120" placeholder="Search groceries...">
    </form>
    <div class="soss-search-spacer" th:unless="${active == 'home'}" aria-hidden="true"></div>
    <nav class="soss-nav" aria-label="Main navigation">
      <a th:classappend="${active == 'home'} ? 'active' : ''" th:href="@{/}">Home</a>
      <a th:classappend="${active == 'products'} ? 'active' : ''" th:href="@{/products}">Products</a>
      <a sec:authorize="hasRole('CUSTOMER')" th:classappend="${active == 'cart'} ? 'active' : ''" th:href="@{/cart}">Cart</a>
      <a sec:authorize="hasRole('CUSTOMER')" th:classappend="${active == 'orders'} ? 'active' : ''" th:href="@{/orders}">Orders</a>
      <a sec:authorize="hasAnyRole('STAFF', 'ADMIN')" th:classappend="${active == 'inventory'} ? 'active' : ''" th:href="@{/inventory}">Inventory</a>
      <a sec:authorize="hasAnyRole('STAFF', 'ADMIN', 'DELIVERY')" th:classappend="${active == 'delivery'} ? 'active' : ''" th:href="@{/delivery/manage}">Delivery</a>
      <a sec:authorize="isAnonymous()" th:classappend="${active == 'login'} ? 'active' : ''" th:href="@{/login}">Log in</a>
      <a sec:authorize="isAuthenticated()" th:classappend="${active == 'profile'} ? 'active' : ''" th:href="@{/profile}">Profile</a>
      <form sec:authorize="isAuthenticated()" method="post" th:action="@{/logout}">
        <button class="soss-logout" type="submit">Logout</button>
      </form>
    </nav>
  </div>
</header>
<footer th:fragment="footer">Bula Basket · Fresh groceries around Suva · Fiji</footer>
</body>
</html>
