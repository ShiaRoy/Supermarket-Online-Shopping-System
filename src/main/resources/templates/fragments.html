<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' · Bula Basket'">Bula Basket</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/cart-checkout.css}">
  <link rel="stylesheet" th:href="@{/css/cart-checkout-polish.css}">
  <link rel="stylesheet" th:href="@{/css/navigation.css}">
  <link rel="stylesheet" th:href="@{/css/orders-payments.css}">
  <link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">
</head>
<body>
<header th:fragment="siteHeader(active)" class="soss-header">
  <div class="soss-header-inner">
    <a class="soss-brand" th:href="@{/}" aria-label="Bula Basket home">
      <img th:src="@{/images/bula-basket-logo.png}" alt="Bula Basket">
    </a>
    <form class="soss-search" th:if="${active == 'home'}" method="get" th:action="@{/products}" role="search">
      <label class="visually-hidden" for="site-search">Search groceries</label>
      <input id="site-search" name="q" type="search" maxlength="120" placeholder="Search groceries...">
    </form>
    <div class="soss-search-spacer" th:unless="${active == 'home'}" aria-hidden="true"></div>
    <nav class="soss-nav" aria-label="Main navigation">
      <button class="soss-menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav-links" aria-label="Open navigation menu">
        <span aria-hidden="true">☰</span>
      </button>
      <div class="soss-nav-links" id="site-nav-links">
        <a th:classappend="${active == 'home'} ? 'active' : ''" th:attr="aria-current=${active == 'home'} ? 'page' : null" th:href="@{/}">Home</a>
        <a th:classappend="${active == 'products'} ? 'active' : ''" th:attr="aria-current=${active == 'products'} ? 'page' : null" th:href="@{/products}">Products</a>
        <a sec:authorize="hasRole('CUSTOMER')" th:classappend="${active == 'cart'} ? 'active' : ''" th:attr="aria-current=${active == 'cart'} ? 'page' : null" th:href="@{/cart}">Cart</a>
        <a sec:authorize="hasRole('CUSTOMER')" th:classappend="${active == 'orders'} ? 'active' : ''" th:attr="aria-current=${active == 'orders'} ? 'page' : null" th:href="@{/orders}">Orders</a>
        <a sec:authorize="hasRole('STAFF')" th:classappend="${active == 'staff-orders'} ? 'active' : ''" th:attr="aria-current=${active == 'staff-orders'} ? 'page' : null" th:href="@{/staff/orders}">Orders</a>
        <a sec:authorize="hasRole('ADMIN')" th:classappend="${active == 'admin-orders'} ? 'active' : ''" th:attr="aria-current=${active == 'admin-orders'} ? 'page' : null" th:href="@{/admin/orders}">Orders</a>

        <details class="soss-admin-menu" sec:authorize="hasRole('ADMIN')">
          <summary th:classappend="${active == 'admin-dashboard' or active == 'admin-users' or active == 'inventory' or active == 'delivery' or active == 'support'} ? 'active' : ''"
                   aria-label="Admin management menu">Admin</summary>
          <div class="soss-admin-menu-panel" role="group" aria-label="Admin management pages">
            <a th:classappend="${active == 'admin-dashboard'} ? 'active' : ''" th:attr="aria-current=${active == 'admin-dashboard'} ? 'page' : null" th:href="@{/admin/dashboard}">Admin Dashboard</a>
            <a th:classappend="${active == 'admin-users'} ? 'active' : ''" th:attr="aria-current=${active == 'admin-users'} ? 'page' : null" th:href="@{/admin/users}">Manage Users &amp; Roles</a>
            <a th:classappend="${active == 'inventory'} ? 'active' : ''" th:attr="aria-current=${active == 'inventory'} ? 'page' : null" th:href="@{/inventory}">Inventory Management</a>
            <a th:classappend="${active == 'delivery'} ? 'active' : ''" th:attr="aria-current=${active == 'delivery'} ? 'page' : null" th:href="@{/delivery/manage}">Delivery Management</a>
            <a th:classappend="${active == 'support'} ? 'active' : ''" th:attr="aria-current=${active == 'support'} ? 'page' : null" th:href="@{/support/manage}">Customer Support</a>
          </div>
        </details>

        <a sec:authorize="hasRole('STAFF')" th:classappend="${active == 'inventory'} ? 'active' : ''" th:attr="aria-current=${active == 'inventory'} ? 'page' : null" th:href="@{/inventory}">Inventory</a>
        <a sec:authorize="hasRole('STAFF')" th:classappend="${active == 'delivery'} ? 'active' : ''" th:attr="aria-current=${active == 'delivery'} ? 'page' : null" th:href="@{/delivery/manage}">Delivery</a>
        <a sec:authorize="hasRole('STAFF')" th:classappend="${active == 'support'} ? 'active' : ''" th:attr="aria-current=${active == 'support'} ? 'page' : null" th:href="@{/support/manage}">Support</a>
        <a sec:authorize="hasRole('DELIVERY')" th:classappend="${active == 'delivery'} ? 'active' : ''" th:attr="aria-current=${active == 'delivery'} ? 'page' : null" th:href="@{/delivery/manage}">Delivery</a>
        <a sec:authorize="isAnonymous()" th:classappend="${active == 'login'} ? 'active' : ''" th:attr="aria-current=${active == 'login'} ? 'page' : null" th:href="@{/login}">Log in</a>
        <a sec:authorize="isAuthenticated()" th:classappend="${active == 'profile'} ? 'active' : ''" th:attr="aria-current=${active == 'profile'} ? 'page' : null" th:href="@{/profile}">Profile</a>
        <form sec:authorize="isAuthenticated()" method="post" th:action="@{/logout}">
          <button class="soss-logout" type="submit">Logout</button>
        </form>
      </div>
    </nav>
  </div>
  <script defer th:src="@{/js/navigation.js}"></script>
</header>
<footer th:fragment="footer">Bula Basket · Fresh groceries around Suva · Fiji</footer>
</body>
</html>
