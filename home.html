<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Fresh groceries')}"></head><body><header th:replace="~{fragments :: header('home')}"></header><main class="shop-container"><h1>Fresh groceries, at your door</h1><form th:action="@{/search}" method="get" class="d-flex gap-2 mb-4"><label for="q" class="visually-hidden">Search groceries</label><input id="q" name="q" th:value="${q}" class="form-control" placeholder="Search groceries"><button class="btn btn-success">Search</button></form>
<div class="row g-4"><div th:each="p : ${products}" class="col-md-4"><article class="panel"><div class="product-icon mb-3" th:text="${p.icon}"></div><h2 th:text="${p.name}"></h2><p th:text="'$' + ${#numbers.formatDecimal(p.price,1,2)}"></p><form th:action="@{/cart/quantity}" method="post"><input type="hidden" name="productId" th:value="${p.id}"><input type="hidden" name="delta" value="1"><button class="btn btn-success">Add to basket</button></form></article></div></div><p th:if="${products.isEmpty()}">No groceries found.</p></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
