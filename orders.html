<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('My orders')}"></head><body><header th:replace="~{fragments :: header('orders')}"></header><main class="shop-container"><h1>My orders</h1><section class="panel"><p th:if="${orders.isEmpty()}">No orders yet. <a th:href="@{/}">Browse groceries</a></p><div class="order-row" th:each="order : ${orders}"><div><a th:href="@{/confirmation/{id}(id=${order.id})}" th:text="'Order #' + ${order.id}"></a><small class="d-block" th:text="${order.deliverySlot}"></small></div><span th:text="${order.paymentStatus}"></span><strong th:text="'$' + ${#numbers.formatDecimal(order.total,1,2)}"></strong></div></section></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
